name: backend-ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: pytest -q
      - name: Security scan
        working-directory: .
        run: python scripts/security_scan.py
